name: intel-dmg
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-13        # 最后一代 Intel 官方 runner，关键
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: build deps
        run: |
          python -m pip install --no-build-isolation -r desktop-requirements.txt pyinstaller==6.16.0
          python dev/desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: A7C2Tools-macOS-x86_64
          path: dist/*.dmg