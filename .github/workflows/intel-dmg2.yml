name: intel-dmg2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Enable Rosetta
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Python 3.11.9 (universal2 pkg)
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /

      - name: HARD CHECK — must be x86_64
        run: |
          ARCH=$(arch -x86_64 /usr/local/bin/python3.11 -c "import platform; print(platform.machine())")
          echo "Python arch = $ARCH"
          if [ "$ARCH" != "x86_64" ]; then
            echo "::error::Python is $ARCH, expected x86_64. Rosetta not working."
            exit 1
          fi

      - name: Upgrade build tools
        run: arch -x86_64 /usr/local/bin/python3.11 -m pip install --upgrade pip setuptools wheel

      - name: Install deps
        run: |
          arch -x86_64 /usr/local/bin/python3.11 -m pip install --no-build-isolation \
            -r desktop-requirements.txt pyinstaller==6.16.0

      - name: Build DMG
        run: arch -x86_64 /usr/local/bin/python3.11 dev/desktop/build.py

      - uses: actions/upload-artifact@v5
        with:
          name: A7C2Tools-macOS-x86_64
          path: dist/*.dmg
