name: intel-dmg2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Enable Rosetta
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64          # 关键：装 x86_64 Python，在 arm64 runner 上走 Rosetta

      - name: Verify architecture
        run: python -c "import platform; print('arch =', platform.machine())"
        # 这行必须输出 arch = x86_64；如果输出 arm64 说明没吃到 Rosetta，再排查

      - name: Install deps and build
        run: |
          python -m pip install --no-build-isolation -r desktop-requirements.txt pyinstaller==6.16.0
          python dev/desktop/build.py

      - uses: actions/upload-artifact@v5
        with:
          name: A7C2Tools-macOS-x86_64
          path: dist/*.dmg
